name: Core Python tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native macOS dependency
        if: runner.os == 'macOS'
        run: brew install zbar
      - name: Install test dependencies
        run: python -m pip install -r requirements.test.txt
      - name: Record runtime versions
        run: |
          python --version
          node --version
          python -m pip --version
          python -m pytest --version
          python -m pip list --format=freeze
      - name: Collect Windows suite
        if: runner.os == 'Windows'
        run: python -m pytest --collect-only -q
      - name: Run Windows suite
        if: runner.os == 'Windows'
        # This assertion binds a frozen baseline to its reference machine, not a hosted runner.
        run: >-
          python -m pytest -q
          --deselect=tests/test_batch_validation.py::test_pinned_baseline_contract_uses_current_stable_hardware_fingerprint
      - name: Collect portable macOS suite
        if: runner.os == 'macOS'
        run: >-
          python -m pytest --collect-only -q
          tests/test_core_review_fixes.py tests/test_invoice_regression_p2.py
          tests/test_mailbox_scanner.py tests/test_pairing_engine.py
          tests/test_run_coordinator.py tests/test_run_lifecycle.py
          tests/test_task8_review_remediation.py
      - name: Run portable macOS suite
        if: runner.os == 'macOS'
        run: >-
          python -m pytest -q
          tests/test_core_review_fixes.py tests/test_invoice_regression_p2.py
          tests/test_mailbox_scanner.py tests/test_pairing_engine.py
          tests/test_run_coordinator.py tests/test_run_lifecycle.py
          tests/test_task8_review_remediation.py
