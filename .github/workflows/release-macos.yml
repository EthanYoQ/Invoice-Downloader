name: Release macOS installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v2026.07.29.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native packaging dependencies
        run: brew install librsvg zbar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.release.txt pyinstaller pyobjc

      - name: Build and verify installer
        run: bash build/macos/build_release.sh '${{ inputs.tag }}'

      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          if-no-files-found: error
          path: |
            dist/macos/arm64/*.dmg
            dist/macos/arm64/*.SHA256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_title="InvoiceFlowAI ${RELEASE_TAG}"
          release_notes="Native macOS Apple Silicon installer built from ${GITHUB_SHA}, with a SHA-256 manifest. The installer is unsigned and not notarized."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "$release_title" --notes "$release_notes"
          fi
