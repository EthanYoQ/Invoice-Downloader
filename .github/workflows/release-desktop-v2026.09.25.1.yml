name: Release desktop v2026.09.25.1

on:
  push:
    branches: [release/v2026.09.25.1]
    paths:
      - .github/workflows/release-desktop-v2026.09.25.1.yml
      - .github/release-contracts/unified-desktop-v2026.09.25.1.json
  workflow_dispatch:

permissions: {}
concurrency:
  group: desktop-release-v2026.09.25.1
  cancel-in-progress: false

env:
  RELEASE_TAG: v2026.09.25.1
  RELEASE_CONTRACT: .github/release-contracts/unified-desktop-v2026.09.25.1.json
  REVIEWED_SOURCE: 8fe3a1147c619268b41f1480e73c4fa38d97db69
  PYTHONUTF8: '1'

jobs:
  contract:
    name: Verify release scope and frozen assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify only release configuration differs from reviewed code
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          c = json.loads(Path(os.environ['RELEASE_CONTRACT']).read_text(encoding='utf-8'))
          assert os.environ['GITHUB_REF'] == 'refs/heads/release/v2026.09.25.1'
          assert c['tag'] == os.environ['RELEASE_TAG']
          assert c['reviewed_source_revision'] == os.environ['REVIEWED_SOURCE']
          subprocess.run(['git', 'merge-base', '--is-ancestor', os.environ['REVIEWED_SOURCE'], 'HEAD'], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', os.environ['REVIEWED_SOURCE'], 'HEAD'], text=True).splitlines())
          allowed = {os.environ['RELEASE_CONTRACT'], '.github/workflows/release-desktop-v2026.09.25.1.yml'}
          assert changed <= allowed, f'Unreviewed production changes: {sorted(changed - allowed)}'
          expected = {f"InvoiceFlowAI-{c['tag']}-{suffix}" for suffix in ('macos-arm64.dmg', 'windows-x64-setup.exe', 'windows-x64-portable.zip', 'SHA256SUMS.txt', 'release-manifest.json')}
          assert set(c['assets']) == expected and len(c['assets']) == 5
          print('Verified reviewed source, release branch, and five-asset contract.')
          PY

  qualify_macos_arm64:
    name: Test and qualify macOS Apple Silicon
    needs: contract
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native and Python build dependencies
        run: |
          test "$(uname -m)" = arm64
          brew install librsvg zbar
          python -m pip install -r requirements.test.txt pyinstaller pyobjc
      - name: Run the established portable macOS regression suite
        run: >-
          python -m pytest -q
          tests/test_core_review_fixes.py tests/test_invoice_regression_p2.py
          tests/test_mailbox_scanner.py tests/test_pairing_engine.py
          tests/test_run_coordinator.py tests/test_run_lifecycle.py
          tests/test_task8_review_remediation.py
      - name: Build DMG and verify the mounted copy and bundled browser
        run: |
          bash build/macos/build_release.sh "$RELEASE_TAG"
          dmg="dist/macos/arm64/InvoiceFlowAI-${RELEASE_TAG}-macos-arm64.dmg"
          test -s "$dmg"
          mount_copy="$(mktemp -d)"
          device=""
          cleanup() {
            if [[ -n "$device" ]]; then hdiutil detach "$device" -quiet || true; fi
            rm -rf "$mount_copy"
          }
          trap cleanup EXIT
          attach_output="$(hdiutil attach -nobrowse -readonly "$dmg")"
          device="$(printf '%s\n' "$attach_output" | awk 'NR == 1 { print $1 }')"
          mount_point="$(printf '%s\n' "$attach_output" | awk -F '\t' '/\/Volumes\// { print $NF; exit }')"
          test -n "$device"
          test -d "$mount_point/InvoiceFlowAI.app"
          ditto "$mount_point/InvoiceFlowAI.app" "$mount_copy/InvoiceFlowAI.app"
          INVOICEFLOWAI_PLAYWRIGHT_RUNTIME_SMOKE=1 "$mount_copy/InvoiceFlowAI.app/Contents/MacOS/InvoiceFlowAI" --help | grep --quiet -- '--run-context'
          mkdir -p release-assets/macos
          cp "$dmg" "release-assets/macos/$(basename "$dmg")"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('release-assets/macos/macos-arm64-qualification.json').write_text(json.dumps({
              'platform': 'macos-arm64', 'tag': os.environ['RELEASE_TAG'],
              'source_revision': os.environ['GITHUB_SHA'],
              'assets': [f"InvoiceFlowAI-{os.environ['RELEASE_TAG']}-macos-arm64.dmg"],
              'acceptance': {'native_arm64_runner': True, 'portable_regression_suite': True, 'post_copy_chromium_structure': True, 'dmg_mount_copy_playwright_smoke': True},
              'signing': {'status': 'unsigned', 'notarized': False}
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-qualified
          if-no-files-found: error
          path: release-assets/macos/
          retention-days: 7

  qualify_windows_x64:
    name: Test and qualify Windows x64
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.test.txt
      - name: Run the established hosted Windows regression suite
        # The frozen hardware-fingerprint assertion is specific to its reference machine.
        run: >-
          python -m pytest -q
          --deselect=tests/test_batch_validation.py::test_pinned_baseline_contract_uses_current_stable_hardware_fingerprint
      - name: Build and verify installer, upgrade, launch, portable ZIP, and uninstall
        shell: pwsh
        run: .\.github\scripts\qualify-windows-release.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-qualified
          if-no-files-found: error
          path: release-assets/windows/
          retention-days: 7

  promote:
    name: Verify both platform outputs and SHA-256 manifest
    needs: [qualify_macos_arm64, qualify_windows_x64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-qualified
          path: qualified/macos
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-qualified
          path: qualified/windows
      - name: Verify provenance and prepare immutable release bytes
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          c = json.loads(Path(os.environ['RELEASE_CONTRACT']).read_text(encoding='utf-8'))
          tag = c['tag']
          assert tag == os.environ['RELEASE_TAG']
          for platform, directory in [('macos-arm64', 'macos'), ('windows-x64', 'windows')]:
              e = json.loads(Path(f'qualified/{directory}/{platform}-qualification.json').read_text(encoding='utf-8-sig'))
              assert e['tag'] == tag and e['source_revision'] == os.environ['GITHUB_SHA']
              assert e['platform'] == platform and e['acceptance'] and all(v is True for v in e['acceptance'].values())
          bundle = Path('release-bundle')
          bundle.mkdir()
          def digest(path):
              with path.open('rb') as f:
                  return hashlib.file_digest(f, 'sha256').hexdigest()
          assets = []
          for directory, suffix, platform in [('macos', 'macos-arm64.dmg', 'macos-arm64'), ('windows', 'windows-x64-setup.exe', 'windows-x64'), ('windows', 'windows-x64-portable.zip', 'windows-x64')]:
              name = f'InvoiceFlowAI-{tag}-{suffix}'
              source = Path('qualified') / directory / name
              assert source.is_file() and source.stat().st_size > 0, f'Missing artifact: {source}'
              target = bundle / name
              shutil.copy2(source, target)
              assert digest(source) == digest(target)
              assets.append({'name': name, 'platform': platform, 'bytes': target.stat().st_size, 'sha256': digest(target)})
          manifest = bundle / f'InvoiceFlowAI-{tag}-release-manifest.json'
          manifest.write_text(json.dumps({
              'schema_version': 1, 'tag': tag, 'source_revision': os.environ['GITHUB_SHA'],
              'reviewed_source_revision': os.environ['REVIEWED_SOURCE'], 'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'promotion': 'verified immutable qualification bytes',
              'signing': {'macos': 'unsigned-not-notarized', 'windows': 'unsigned'}, 'assets': assets
          }, indent=2) + '\n', encoding='utf-8')
          checksummed = [bundle / item['name'] for item in assets] + [manifest]
          (bundle / f'InvoiceFlowAI-{tag}-SHA256SUMS.txt').write_text(''.join(f'{digest(p)}  {p.name}\n' for p in checksummed), encoding='utf-8')
          assert {p.name for p in bundle.iterdir()} == set(c['assets'])
          print(json.dumps(assets, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-bundle
          if-no-files-found: error
          path: release-bundle/
          retention-days: 7

  publish:
    name: Publish only after uploaded bytes verify
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-bundle
          path: release-bundle
      - name: Verify local bundle, create draft, download and verify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          c = json.loads(Path(os.environ['RELEASE_CONTRACT']).read_text(encoding='utf-8'))
          bundle = Path('release-bundle')
          assert c['tag'] == os.environ['RELEASE_TAG']
          assert {p.name for p in bundle.iterdir()} == set(c['assets'])
          assert all((bundle / name).stat().st_size > 0 for name in c['assets'])
          m = json.loads((bundle / f"InvoiceFlowAI-{c['tag']}-release-manifest.json").read_text())
          assert m['source_revision'] == os.environ['GITHUB_SHA']
          Path('release-notes.md').write_text('''## 本次更新

          本版本包含 PR #184 合并的桌面核心修复：
          - 已下载的发票转人工复核时保留原件；目录或复制失败时保留恢复路径。
          - 修复跨次发票去重记录读取与老版本历史迁移。
          - 同步配对重命名后的结果页和 Excel 文件路径。
          - 邮箱连接验证服务器证书，增加有限等待，区分主动停止与真实故障。
          - Excel 外部文本按文字保存，避免被误当成公式。
          - 修复已有海外票据可选分支的千位金额解析。

          ## 下载
          - macOS Apple Silicon（M 系列，ARM64）：DMG。
          - Windows x64：安装程序 EXE；另提供免安装 ZIP。
          - 同时提供 SHA256SUMS 与 release-manifest 构建来源清单。

          两个平台均通过本次源码回归和既有安装包运行时验证。macOS 回归为 portable 子集；Windows 排除一项只适用于参考机器的硬件断言。未进行真实邮箱与个人票据的端到端验收。

          安装包未签名，macOS 未公证，首次运行可能需要在系统安全设置中允许；Windows 可能提示 SmartScreen。DSH 插件不在本次发布范围。
          ''', encoding='utf-8')
          PY
          (cd release-bundle && sha256sum --check "InvoiceFlowAI-$RELEASE_TAG-SHA256SUMS.txt")
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" > existing-tag.txt
          if [[ -s existing-tag.txt ]]; then
            echo "Refusing to reuse an existing tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing release: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-bundle/* --target "$GITHUB_SHA" --draft --title "InvoiceFlowAI $RELEASE_TAG" --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json isDraft,assets > uploaded-release.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          c = json.loads(Path(os.environ['RELEASE_CONTRACT']).read_text(encoding='utf-8'))
          uploaded = json.loads(Path('uploaded-release.json').read_text())
          assert uploaded['isDraft'] is True
          assert {a['name'] for a in uploaded['assets']} == set(c['assets'])
          assert all(a['size'] > 0 for a in uploaded['assets'])
          PY
          mkdir verification-download
          gh release download "$RELEASE_TAG" --pattern "InvoiceFlowAI-$RELEASE_TAG-*" --dir verification-download
          (cd verification-download && sha256sum --check "InvoiceFlowAI-$RELEASE_TAG-SHA256SUMS.txt")
          cmp "release-bundle/InvoiceFlowAI-$RELEASE_TAG-SHA256SUMS.txt" "verification-download/InvoiceFlowAI-$RELEASE_TAG-SHA256SUMS.txt"
          gh release edit "$RELEASE_TAG" --draft=false
