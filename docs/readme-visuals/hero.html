<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=2560, initial-scale=1" />
  <title>InvoiceFlowAI README Hero</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 2560px; height: 1280px; overflow: hidden; }
    body {
      position: relative;
      color: #f8fafc;
      background:
        radial-gradient(circle at 82% 22%, rgba(59,130,246,.24), transparent 32%),
        radial-gradient(circle at 35% 100%, rgba(16,185,129,.10), transparent 32%),
        #08111f;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(148,163,184,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,.045) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: linear-gradient(90deg, black, transparent 74%);
    }
    .copy {
      position: absolute;
      left: 154px;
      top: 132px;
      width: 940px;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 28px; }
    .brand img { width: 108px; height: 108px; object-fit: contain; }
    .name { font-size: 70px; font-weight: 720; letter-spacing: -2px; }
    .byline { margin-top: 7px; color: #8fa5c5; font-size: 29px; font-weight: 500; }
    .headline { margin-top: 154px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
    .headline span {
      padding: 17px 24px 20px;
      color: #07101f;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 57px;
      font-weight: 520;
      line-height: 1.05;
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
    }
    .pipeline {
      margin-top: 76px;
      display: flex;
      align-items: center;
      gap: 20px;
      color: #b9c9e2;
      font-size: 25px;
      font-weight: 600;
    }
    .pipeline span {
      padding: 17px 20px;
      border: 1px solid rgba(148,163,184,.22);
      border-radius: 14px;
      background: rgba(15,28,48,.78);
    }
    .pipeline i { width: 34px; height: 2px; display: block; background: #3b82f6; }
    ul { margin: 80px 0 0; padding: 0; list-style: none; color: #e5edf8; font-size: 34px; line-height: 1.62; }
    li::before { content: "·"; color: #60a5fa; margin-right: 20px; font-weight: 800; }
    .shots { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
    .shot {
      position: absolute;
      display: block;
      width: 930px;
      height: auto;
      object-fit: contain;
      border: 5px solid rgba(226,232,240,.20);
      border-radius: 16px;
      background: #0b1424;
      box-shadow: 0 38px 90px rgba(0,0,0,.46), 0 10px 26px rgba(0,0,0,.30);
    }
    .setup { left: 1135px; top: 280px; z-index: 12; transform: rotate(3.5deg); }
    .processing { left: 1515px; top: -155px; z-index: 7; transform: rotate(4.5deg); }
    .disclaimer { left: 1770px; top: 790px; z-index: 9; transform: rotate(4deg); }
    .accent { position: absolute; z-index: 16; border-radius: 999px; }
    .accent.one { left: 1060px; top: 182px; width: 22px; height: 22px; background: #60a5fa; }
    .accent.two { left: 1050px; top: 744px; width: 13px; height: 13px; border: 3px solid #34d399; }
    .slash { position: absolute; left: 91px; top: 352px; z-index: 22; width: 75px; height: 17px; background: #3b82f6; transform: rotate(-42deg); border-radius: 4px; }
    .slash::after { content: ""; position: absolute; left: 32px; top: 24px; width: 44px; height: 10px; background: #34d399; border-radius: 3px; }
  </style>
</head>
<body>
  <main class="copy">
    <section class="brand">
      <img src="../../build/windows/assets/invoiceflowai-icon.svg" alt="" />
      <div>
        <div class="name">InvoiceFlowAI</div>
        <div class="byline">Invoice Assistant · EthanYoQ</div>
      </div>
    </section>
    <section class="headline">
      <span id="headline-one">邮箱发票，自动归档</span>
      <span id="headline-two">下载 · 识别 · 汇总</span>
    </section>
    <section class="pipeline" aria-label="workflow">
      <span id="source">QQ / 163 邮箱</span><i></i><span>PDF / OFD / XML</span><i></i><span id="report">Excel 报销汇总</span>
    </section>
    <ul>
      <li id="f1">邮箱只读抓取</li>
      <li id="f2">GLM OCR 双引擎识别</li>
      <li id="f3">本地分类与归档</li>
      <li id="f4">一键生成报销汇总</li>
    </ul>
  </main>
  <section class="shots" aria-label="real product screenshots">
    <img class="shot processing" src="../images/invoiceflowai-processing-zh.png" alt="" />
    <img class="shot setup" src="../images/invoiceflowai-setup-zh.png" alt="" />
    <img class="shot disclaimer" src="../images/invoiceflowai-disclaimer-zh.png" alt="" />
  </section>
  <div class="slash"></div><div class="accent one"></div><div class="accent two"></div>
  <script>
    const en = new URLSearchParams(location.search).get('lang') === 'en';
    if (en) {
      document.documentElement.lang = 'en';
      document.getElementById('headline-one').textContent = 'Invoice emails, organized';
      document.getElementById('headline-two').textContent = 'Download · recognize · report';
      document.getElementById('source').textContent = 'QQ / 163 Mail';
      document.getElementById('report').textContent = 'Excel reimbursement report';
      document.getElementById('f1').textContent = 'Read-only mailbox retrieval';
      document.getElementById('f2').textContent = 'Dual-engine GLM OCR recognition';
      document.getElementById('f3').textContent = 'Local classification and archive';
      document.getElementById('f4').textContent = 'One-click reimbursement summary';
    }
  </script>
</body>
</html>
